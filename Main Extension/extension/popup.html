<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #323c38;
      background: #faf7f2;
    }
    h1 { margin: 0 0 14px; line-height: 0; }
    .logo { height: 30px; width: auto; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .label { font-weight: 600; }
    #state { color: #5c937a; font-weight: 600; margin-left: 6px; }

    /* On/off switch */
    .switch { position: relative; width: 46px; height: 26px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #c9c3bb; border-radius: 26px; transition: background 0.15s;
    }
    .slider::before {
      content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: transform 0.15s;
    }
    .switch input:checked + .slider { background: #6fa58c; }
    .switch input:checked + .slider::before { transform: translateX(20px); }
    .switch input:focus-visible + .slider { outline: 2px solid #6fa58c; outline-offset: 2px; }

    p { margin: 10px 0 0; color: #666; font-size: 12px; line-height: 1.4; }
    .note { margin-top: 14px; font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <h1><img src="icons/savED-wordmark.png" alt="savED" class="logo"></h1>
  <div class="row">
    <span><span class="label">Filter</span><span id="state">On</span></span>
    <label class="switch" title="Turn the filter on or off">
      <input type="checkbox" id="enabled" aria-label="Filter on or off">
      <span class="slider"></span>
    </label>
  </div>
  <p>Hides posts and videos about dieting, calorie counting, and weight loss on Instagram, YouTube, and TikTok.</p>
  <p class="note">This project is a prototype and is not medical advice.</p>
  <script src="popup.js"></script>
</body>
</html>
