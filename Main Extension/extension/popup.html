<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #333;
      background: #faf7f2;
    }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }
    input { width: 18px; height: 18px; cursor: pointer; }
    p { margin: 8px 0 0; color: #666; font-size: 12px; line-height: 1.4; }
    .note { margin-top: 14px; font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <h1>savED</h1>
  <label>
    <input type="checkbox" id="strict">
    Strict mode
  </label>
  <p>Also hides diet and weight-loss posts and videos, like low-calorie recipes, not just content that promotes restriction. Works on Instagram, YouTube, and TikTok.</p>
  <p class="note">This project is a prototype and is not medical advice.</p>
  <script src="popup.js"></script>
</body>
</html>
